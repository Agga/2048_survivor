<!DOCTYPE html>
<!-- The browser build's page (Trunk reads it: `trunk serve` / `trunk build`).
     The game draws into the canvas #game, which fills the page. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2048 Survivor</title>
    
<script type="module">
import init, * as bindings from './survivor_2048-2c7a531d283eb0ad.js';
const wasm = await init({ module_or_path: './survivor_2048-574202d469c4455c_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #16131f;
        }
        #game {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #edc22e;
            font: bold 28px monospace;
            pointer-events: none;
        }
    </style>
<link rel="modulepreload" href="./survivor_2048-2c7a531d283eb0ad.js" crossorigin="anonymous" integrity="sha384-lvh1jToXT9hxjtm+E09OFYS2KdZmKk/5Yla/95DvbBxpNpv99DRtgxg5QRYfIoaK"><link rel="preload" href="./survivor_2048-574202d469c4455c_bg.wasm" crossorigin="anonymous" integrity="sha384-V+2Qyf7Of+BsM776rtTNcEL/Wcd5xUQJlos9EK+CI49/A4BtgW9xhUTUETSfNW3Q" as="fetch" type="application/wasm"></head>
<body>
    <div id="loading">Loading 2048 Survivor...</div>
    <canvas id="game" tabindex="0"></canvas>
    <script>
        // Keys go to the game: focus the canvas at the start and on a click.
        const canvas = document.getElementById("game");
        canvas.addEventListener("pointerdown", () => canvas.focus());
        window.addEventListener("load", () => canvas.focus());
        // The loading text stays until the game has started (Trunk's event,
        // after the .wasm is downloaded and running); if it can't start, the
        // reason replaces it instead of a blank page.
        const loading = document.getElementById("loading");
        addEventListener("TrunkApplicationStarted", () => loading?.remove());
        const failed = (reason) => {
            if (loading?.isConnected) loading.textContent = "Could not start: " + reason;
        };
        addEventListener("error", (e) => failed(e.message));
        addEventListener("unhandledrejection", (e) => failed(e.reason));
    </script>
</body>
</html>
